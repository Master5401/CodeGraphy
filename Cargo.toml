[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/server",
    "crates/core",
    "crates/backends",
    "crates/linker",
    "crates/flow",
    "crates/bio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
anyhow = "1.0"
atlas-engine = { git = "https://github.com/LordCasser/atlas", rev = "0f8379ff61a6f5ea1ae888d331f21b8b44f6a5b7", default-features = false, features = ["java"] }
axum = "0.8.9"
blake3 = "1.8"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
ignore = "0.4.34"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
webbrowser = "1.2.7"
